<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffe3ef"/>
<stop offset="1" stop-color="#ffc2dc"/>
</linearGradient>
</defs>
<rect width="600" height="340" fill="url(#bg)"/>

<!-- clouds -->
<g fill="#fff" opacity="0.8">
<circle cx="70" cy="60" r="22"/><circle cx="95" cy="52" r="28"/><circle cx="125" cy="62" r="20"/><rect x="50" y="60" width="95" height="22" rx="11"/>
<circle cx="480" cy="50" r="18"/><circle cx="505" cy="42" r="24"/><circle cx="532" cy="52" r="17"/><rect x="462" y="50" width="88" height="20" rx="10"/>
</g>

<!-- stars -->
<g fill="#fff" stroke="#ff8fbf" stroke-width="2">
<path d="M45 150 l5 12 13 1 -10 8 3 13 -11 -7 -11 7 3 -13 -10 -8 13 -1z"/>
<path d="M545 170 l4 10 11 1 -9 7 3 11 -9 -6 -9 6 3 -11 -9 -7 11 -1z"/>
</g>

<!-- hearts -->
<g fill="#ff5fa2">
<path d="M150 130 c-8 -14 -26 -2 -14 12 l14 13 14 -13 c12 -14 -6 -26 -14 -12z"/>
<path d="M455 120 c-6 -10 -19 -1 -10 9 l10 10 10 -10 c9 -10 -4 -19 -10 -9z" fill="#ff8fbf"/>
</g>

<!-- laptop -->
<rect x="190" y="150" width="220" height="125" rx="10" fill="#fff" stroke="#ff8fbf" stroke-width="4"/>
<rect x="204" y="164" width="192" height="97" rx="6" fill="#ffeaf3"/>
<text x="300" y="228" font-family="Courier New, monospace" font-size="40" font-weight="bold" fill="#ff5fa2" text-anchor="middle">&lt;/&gt;</text>
<path d="M165 275 L435 275 L418 295 L182 295 Z" fill="#ff8fbf"/>

<!-- cute bunny character peeking above laptop -->
<!-- ears -->
<ellipse cx="270" cy="55" rx="16" ry="40" fill="#fff" stroke="#ff8fbf" stroke-width="3"/>
<ellipse cx="270" cy="58" rx="8" ry="26" fill="#ffb6d3"/>
<ellipse cx="330" cy="55" rx="16" ry="40" fill="#fff" stroke="#ff8fbf" stroke-width="3"/>
<ellipse cx="330" cy="58" rx="8" ry="26" fill="#ffb6d3"/>
<!-- head -->
<circle cx="300" cy="120" r="55" fill="#fff" stroke="#ff8fbf" stroke-width="3"/>
<!-- cheeks -->
<circle cx="262" cy="135" r="11" fill="#ffb6d3"/>
<circle cx="338" cy="135" r="11" fill="#ffb6d3"/>
<!-- eyes -->
<circle cx="278" cy="118" r="7" fill="#3a2a3f"/>
<circle cx="322" cy="118" r="7" fill="#3a2a3f"/>
<circle cx="280" cy="115" r="2.5" fill="#fff"/>
<circle cx="324" cy="115" r="2.5" fill="#fff"/>
<!-- nose + mouth -->
<ellipse cx="300" cy="132" rx="5" ry="3.5" fill="#ff5fa2"/>
<path d="M290 140 Q295 148 300 140 Q305 148 310 140" stroke="#3a2a3f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<!-- paws on laptop -->
<ellipse cx="262" cy="172" rx="16" ry="11" fill="#fff" stroke="#ff8fbf" stroke-width="3"/>
<ellipse cx="338" cy="172" rx="16" ry="11" fill="#fff" stroke="#ff8fbf" stroke-width="3"/>

<!-- AI bubble -->
<rect x="400" y="85" width="80" height="44" rx="14" fill="#ff5fa2"/>
<path d="M418 129 L410 146 L436 129 Z" fill="#ff5fa2"/>
<text x="440" y="116" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">AI</text>

<!-- title -->
<text x="300" y="325" font-family="Arial, sans-serif" font-size="20" fill="#d1387b" text-anchor="middle" font-weight="bold">Learn Programming with AI</text>
</svg>
